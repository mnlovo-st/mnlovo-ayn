name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "**.md"
      - ".github/workflows/keepalive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Pick the newest Xcode
        # Xcode 26 brings the iOS 26 SDK, which the scheduled Dynamic Island countdown needs.
        # Falls back to the image's default if 26 isn't installed.
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Check Supabase (info only)
        continue-on-error: true
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' App/Sources/Core/SupabaseConfig.swift || true)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' App/Sources/Core/SupabaseConfig.swift || true)
          if [ -n "$URL" ]; then
            echo "auth settings: $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/settings")"
            echo "storage bucket check (401/400 expected without login): $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/storage/v1/bucket/backups")"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project AYN.xcodeproj -target AYN -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          echo "======== ERRORS ========"
          grep -E "error:" build.log | sort -u | head -100
          echo "======== LAST LINES ========"
          tail -30 build.log
          if [ $STATUS -ne 0 ] || [ ! -f build/Release-iphoneos/AYN.app/AYN ]; then
            echo "::error::Build failed. Send build.log (Artifacts → build-log) to fix it."
            exit 1
          fi

      - name: Ad-hoc sign with entitlements (Sideloadly/AltStore re-sign later)
        run: |
          APP=build/Release-iphoneos/AYN.app
          if [ -d "$APP/PlugIns/AYNWidget.appex" ]; then
            codesign --force --sign - --entitlements Widget/AYNWidget.entitlements "$APP/PlugIns/AYNWidget.appex"
          fi
          codesign --force --sign - --entitlements App/AYN.entitlements "$APP"

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/AYN.app Payload/
          zip -qry MNLOVO-SAVER.ipa Payload
          ls -lh MNLOVO-SAVER.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: MNLOVO-SAVER
          path: MNLOVO-SAVER.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MNLOVO SAVER — build ${{ github.run_number }}
          files: MNLOVO-SAVER.ipa
          make_latest: true
