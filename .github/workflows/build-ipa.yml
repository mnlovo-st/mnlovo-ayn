name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project AYN.xcodeproj -target AYN -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          echo "======== ERRORS ========"
          grep -E "error:" build.log | sort -u | head -100
          echo "======== LAST LINES ========"
          tail -30 build.log
          if [ $STATUS -ne 0 ] || [ ! -f build/Release-iphoneos/AYN.app/AYN ]; then
            echo "::error::Build failed. Send build.log (Artifacts → build-log) to fix it."
            exit 1
          fi

      - name: Ad-hoc sign with entitlements (Sideloadly/AltStore re-sign later)
        run: |
          APP=build/Release-iphoneos/AYN.app
          if [ -d "$APP/PlugIns/AYNWidget.appex" ]; then
            codesign --force --sign - --entitlements Widget/AYNWidget.entitlements "$APP/PlugIns/AYNWidget.appex"
          fi
          codesign --force --sign - --entitlements App/AYN.entitlements "$APP"

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/AYN.app Payload/
          zip -qry MNLOVO-AYN.ipa Payload
          ls -lh MNLOVO-AYN.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: MNLOVO-AYN
          path: MNLOVO-AYN.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MNLOVO AYN — build ${{ github.run_number }}
          files: MNLOVO-AYN.ipa
          make_latest: true
